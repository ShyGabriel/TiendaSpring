# Perfil de test: base H2 en memoria (modo MySQL), sin dependencias externas.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# El esquema lo crea Flyway (V1__init.sql), Hibernate no toca la BD.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100

# Mismas propiedades JWT que en main (el application.properties de test sombrea al de main).
app.jwt.secret=test-secret-key-at-least-32-bytes-long-for-hs256
app.jwt.expiration-ms=28800000
