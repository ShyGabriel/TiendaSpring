spring.application.name=bodegaweb

spring.datasource.url=jdbc:mysql://localhost:3306/bodegaweb?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:123}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.jpa.properties.hibernate.format_sql=true

# Evita que un cliente pida paginas enormes en /api/productos (por defecto Spring Data permite hasta 2000).
spring.data.web.pageable.max-page-size=100

# Flyway: baseline permite migrar una BD ya creada (con ddl-auto=update) sin recrearla.
# Con baseline-version=1 (default), una BD existente se marca como "ya en V1" y solo corre V2+.
spring.flyway.baseline-on-migrate=true

# JWT (firma HMAC). La clave debe tener al menos 32 bytes; sobrescribela por env var en producción.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=28800000

# Swagger UI y OpenAPI quedan publicos para desarrollo.
springdoc.swagger-ui.path=/swagger-ui.html
