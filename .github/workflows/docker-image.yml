name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw compile

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Test
        run: ./mvnw test

  package:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Package jar
        run: ./mvnw package -DskipTests

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          IMAGE_TAG=${{ env.REGISTRY }}/$IMAGE_NAME_LOWER:latest
          # Tag con los 7 primeros caracteres del SHA (el mismo que usa deploy)
          SHA_TAG=${{ env.REGISTRY }}/$IMAGE_NAME_LOWER:${GITHUB_SHA::7}

          docker build -t $IMAGE_TAG -t $SHA_TAG .

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker push $IMAGE_TAG
            docker push $SHA_TAG
          fi

  deploy:
    runs-on: self-hosted
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: read
    defaults:
      run:
        shell: powershell
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and run container
        env:
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('MYSQL_URL', 'MYSQL_USER', 'MYSQL_PASSWORD', 'JWT_SECRET')
          $missing = $required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          }
          if ($missing) {
            Write-Error "Missing required repository secrets: $($missing -join ', ')"
            exit 1
          }
          if ($env:JWT_SECRET.Length -lt 32) {
            Write-Error 'JWT_SECRET must contain at least 32 characters.'
            exit 1
          }

          $repo = "${{ env.IMAGE_NAME }}".ToLowerInvariant()
          $tag = "${{ github.sha }}".Substring(0, 7)
          $image = "${{ env.REGISTRY }}/$repo" + ':' + $tag

          docker pull --platform linux/amd64 $image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $existingContainer = docker ps -aq --filter "name=^/bodegaweb$"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($existingContainer) {
            docker rm -f bodegaweb
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          docker run --detach --name bodegaweb --restart unless-stopped --platform linux/amd64 `
            --publish 8080:8080 `
            --env MYSQL_URL --env MYSQL_USER --env MYSQL_PASSWORD --env JWT_SECRET `
            $image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker image prune -f
