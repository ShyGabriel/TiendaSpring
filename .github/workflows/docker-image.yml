name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw compile

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Test
        run: ./mvnw test

  package:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Package jar
        run: ./mvnw package -DskipTests

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          IMAGE_TAG=${{ env.REGISTRY }}/$IMAGE_NAME_LOWER:latest
          # Tag con los 7 primeros caracteres del SHA (el mismo que usa deploy)
          SHA_TAG=${{ env.REGISTRY }}/$IMAGE_NAME_LOWER:${GITHUB_SHA::7}

          docker build -t $IMAGE_TAG -t $SHA_TAG .

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker push $IMAGE_TAG
            docker push $SHA_TAG
          fi

  deploy:
    runs-on: self-hosted
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: read
    defaults:
      run:
        shell: powershell
    steps:
      - name: Compute image name
        id: img
        run: |
          $repo = "${{ env.IMAGE_NAME }}".ToLower()
          $sha  = "${{ github.sha }}".Substring(0, 7)
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=${{ env.REGISTRY }}/${repo}:${sha}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run container on Docker Desktop
        run: |
          $image = "${{ steps.img.outputs.name }}"

          docker pull --platform linux/amd64 $image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Elimina el contenedor anterior solo si existe
          if (docker ps -aq -f "name=^app$") { docker rm -f app | Out-Null }

          docker run -d --name app --platform linux/amd64 -p 8080:8080 $image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker image prune -f
