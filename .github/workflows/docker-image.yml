name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw compile

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Test
        run: ./mvnw test

  package:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Package jar
        run: ./mvnw package -DskipTests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          IMAGE=${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')
          echo "tags=$IMAGE:latest,$IMAGE:${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
  runs-on: self-hosted
  needs: package
  if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  defaults:
    run:
      shell: pwsh
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compute image name
      id: img
      run: |
        $repo = "${{ env.IMAGE_NAME }}".ToLower()
        $sha = "${{ github.sha }}".Substring(0,7)
        "name=${{ env.REGISTRY }}/${repo}:${sha}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Apply manifests
      run: |
        (Get-Content k8s/deployment.yaml -Raw).Replace('IMAGE_PLACEHOLDER', '${{ steps.img.outputs.name }}') | kubectl --context docker-desktop apply -f -
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        kubectl --context docker-desktop apply -f k8s/service.yaml

    - name: Wait for rollout
      run: kubectl --context docker-desktop rollout status deployment/demo --timeout=180s
