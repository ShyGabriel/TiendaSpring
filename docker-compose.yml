services:
  db:
    image: mysql:8.4
    container_name: bodegaweb-db
    environment:
      MYSQL_ROOT_PASSWORD: "123"
      MYSQL_DATABASE: bodegaweb
    ports:
      - "3307:3306"   # 3307 en tu PC para no chocar con un MySQL local
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: bodegaweb-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/bodegaweb?createDatabaseIfNotExist=true
      MYSQL_USER: root
      MYSQL_PASSWORD: "123"
      JWT_SECRET: cambia-esta-clave-por-una-larga-de-al-menos-32-caracteres
      SEED_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"

volumes:
  mysql_data:
