spring.application.name=bodegaweb

# ============================================================
# Datasource - MySQL (schema: ventas_online)
# Ajusta URL / usuario / password a tu entorno local.
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/ventas_online?useSSL=false&serverTimezone=America/Lima&characterEncoding=utf8mb4
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# El esquema ya existe (schema_ventas_online_mysql.sql) ->
#   - "validate" verifica que las entidades calcen con las tablas
#   - "update"   crea columnas/FK faltantes (util en desarrollo)
#   - "none"     no toca la base
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ============================================================
# Jackson
# ============================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
